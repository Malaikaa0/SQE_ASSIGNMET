# SonarQube Project Configuration
# Library Administration System - Baseline Analysis

# Project identification
sonar.projectKey=Library-Management
sonar.projectName=Library Administration System
sonar.projectVersion=1.0-baseline

# Source code location
sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8

# Exclusions (node_modules, build files, etc.)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/certs/**,**/.env*

# Backend (JavaScript/Node.js)
sonar.javascript.file.suffixes=.js,.jsx

# Frontend (JavaScript/React)
# Include both backend and frontend source directories
sonar.tests=
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Language-specific settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Database scripts
sonar.sql.file.suffixes=.sql

# SCM settings
sonar.scm.provider=git
sonar.scm.disabled=false

# Analysis parameters
sonar.verbose=false
sonar.log.level=INFO

# Host URL (default local SonarQube)
sonar.host.url=http://localhost:9000
